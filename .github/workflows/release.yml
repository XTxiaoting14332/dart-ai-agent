name: Publish NWAgent

on:
  push:
    branches:
      - main
    tags:
      - 🏷️*
      - v*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.1

      - name: Compile
        run: |
          mkdir dist
          dart pub get
          dart compile exe bin/nwagent.dart -o dist/nwagent-windows.exe

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nwagent-windows
          path: dist/nwagent-windows.exe

  linux_amd64:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            submodules: true
        - name: Setup Dart
          uses: dart-lang/setup-dart@v1
          with:
            sdk: 3.12.1
  
        - name: Compile
          run: |
            mkdir dist
            dart pub get
            dart compile exe bin/nwagent.dart -o dist/nwagent-linux-amd64
  
        - name: Upload Dist Artifact
          uses: actions/upload-artifact@v4
          with:
            name: nwagent-linux-amd64
            path: dist/nwagent-linux-amd64


  linux_arm64:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Install Dependencies
          run: |
            sudo apt update
            sudo apt install aria2 unzip -y
            aria2c https://storage.googleapis.com/dart-archive/channels/stable/release/3.12.1/sdk/dartsdk-linux-arm64-release.zip
            unzip dartsdk-linux-arm64-release.zip
            rm dartsdk-linux-arm64-release.zip

        - name: Use ARM64 Environment to Compile
          uses: uraimo/run-on-arch-action@v2
          with:
            arch: aarch64
            distro: ubuntu20.04
            run: |
              export PATH=$PATH:$GITHUB_WORKSPACE/dart-sdk/bin
              mkdir dist
              dart pub get
              dart compile exe bin/nwagent.dart -o dist/nwagent-linux-arm64

        - name: Upload Dist Artifact
          uses: actions/upload-artifact@v4
          with:
            name: nwagent-linux-arm64
            path: dist/nwagent-linux-arm64


  linux_arm:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Install Dependencies
          run: |
            sudo apt update
            sudo apt install aria2 unzip -y
            aria2c https://storage.googleapis.com/dart-archive/channels/stable/release/3.12.1/sdk/dartsdk-linux-arm-release.zip
            unzip dartsdk-linux-arm-release.zip
            rm dartsdk-linux-arm-release.zip

        - name: Use ARM Environment to Compile
          uses: uraimo/run-on-arch-action@v2
          with:
            arch: armv7
            distro: ubuntu20.04
            run: |
              export PATH=$PATH:$GITHUB_WORKSPACE/dart-sdk/bin
              mkdir dist
              dart pub get
              dart compile exe bin/nwagent.dart -o dist/nwagent-linux-arm

        - name: Upload Dist Artifact
          uses: actions/upload-artifact@v4
          with:
            name: nwagent-linux-arm
            path: dist/nwagent-linux-arm


  macos_M1:
    runs-on: macos-latest

    steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            submodules: true
        - name: Setup Dart
          uses: dart-lang/setup-dart@v1
          with:
            sdk: 3.12.1

        - name: Compile
          run: |
            mkdir dist
            dart pub get
            dart compile exe bin/nwagent.dart -o dist/nwagent-macos-M1

        - name: Upload Dist Artifact
          uses: actions/upload-artifact@v4
          with:
            name: nwagent-macos-M1
            path: dist/nwagent-macos-M1


  publish_releases:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux_amd64
      - linux_arm64
      - linux_arm
      - macos_M1

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Fetch Version
        run: |
          sudo snap install yq
          version=$(yq eval '.version' pubspec.yaml)
          echo "NWAGENT_VERSION=$version" >> $GITHUB_ENV

      - name: Download Artifact (Windows)
        uses: actions/download-artifact@v4
        with:
          name: "nwagent-windows"
          path: dist/

      - name: Download Artifact (Linux amd64)
        uses: actions/download-artifact@v4
        with:
          name: "nwagent-linux-amd64"
          path: dist/



      - name: Download Artifact (MacOS M1)
        uses: actions/download-artifact@v4
        with:
          name: "nwagent-macos-M1"
          path: dist/

      - name: Download Artifact (Linux arm64)
        uses: actions/download-artifact@v4
        with:
          name: "nwagent-linux-arm64"
          path: dist/

      - name: Download Artifact (Linux arm)
        uses: actions/download-artifact@v4
        with:
          name: "nwagent-linux-arm"
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ env.NWAGENT_VERSION }}
          prerelease: false
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/nwagent-windows.exe
            dist/nwagent-linux-amd64
            dist/nwagent-linux-arm64
            dist/nwagent-linux-arm
            dist/nwagent-macos-M1
